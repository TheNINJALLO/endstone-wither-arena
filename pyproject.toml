[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-wither-arena"
version = "2.0.5"
description = "Restricts Wither spawning to a designated arena, prevents block destruction, and controls mob spawning and block breaking in the arena"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.9,<0.12"
]

[project.entry-points."endstone"]
wither-arena = "endstone_wither_arena.wither_arena:WitherArenaPlugin"